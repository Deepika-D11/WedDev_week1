<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox in CSS</title>
    <style>
        .container {
            border: 2px solid rgb(22, 1, 1);
            display: flex;
            
            justify-content: center;
            align-items: center;
            justify-content: start;
            flex-direction: row;    
            flex-wrap: wrap; 
            align-content: flex-start;   
            flex-flow: row wrap-reverse; 
            gap: 30px 30px; 
            padding: auto;
            /*<!-- row-gap: 2px;
            column-gap: 2px; -->*/
             
        }        
        .item {
            height: 90px;
            width: 90px;
            background-color: rgb(184, 188, 214);
            border: 2px solid rgb(68, 7, 7);
           
        }
    </style>
</head>

<body>
    <main>
        <div class="container">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <div class="container">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <!-- flex-direction: column == items in column 
         column reverse = reverse the row 
         aline content : center = use to center the item when we have more than one line 
         aline item : center we used when we have one line and we want to center them
        There is no justify item in flexbox
         -->

         <!-- flex-flow: row row-reverse;    == use to do two task  1 . flex direction and flex-wrap  -->
        items properties 
    </main>

</body>

</html>
