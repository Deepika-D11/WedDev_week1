<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shasows and outlines in css</title>
    <style>
        .box {
            background-color: pink;
            box-shadow: 5px 5px 15px 5px #8b0d0d;
            
            padding: 30;
            width: 80vh;
            
        }
        .text-element { 
            text-shadow: 2px 2px 4px #7e707d;
            outline: 2px solid rgb(148, 158, 154); 
            border: 2px solid rgb(165, 31, 206);
            border-radius: 8px;
            width: 80vh;
        }
    </style>
</head>

<body>
    <!-- css documentation -->
    <!-- https://www.codewithharry.com/tutorial/css-home/ -->
    <div class="box">
        I am a box
    </div>
    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam, eum. Numquam odit incidunt, voluptates ratione
        ab reprehenderit tenetur optio commodi cumque itaque quos distinctio dolor error. Numquam odio quis suscipit
        quas harum quia consectetur!
    </p>
</body>

</html>
