<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form in html</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Vertically Aligned Form</h1>
    
        <form action="post">
            <div>
                <label for="username">Enter Your name</label>
                <input type="redio" id="username" name="username" placeholder="Enter your username">
            </div>
            <div>
                <label for="city">Enter your city name</label>
                <input type="redio" id="city" name="city" placeholder="Enter your city">
            </div>
            
                <label for="pincode">Enter your pincode</label>
                <input type="redio" id="pincode" name="pincode" placeholder="Enter pincode">
            
            
                <button type="submit">Submit</button>
           
        </form>
        
   
</body>

</html>
